spring.application.name=Pawtok
# Database Config (with fallbacks for local dev)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/pawtok?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC&connectionCollation=utf8mb4_unicode_ci}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.connection-init-sql=SET NAMES utf8mb4 COLLATE utf8mb4_unicode_ci

# UTF-8 Encoding Enforcement
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.encoding.force-request=true
server.servlet.encoding.force-response=true
spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true
spring.http.encoding.force=true



# JPA/Hibernate Config
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=always
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Optimización HikariCP para Aiven Cloud (evita caídas de conexión y reduce latencia)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.validation-timeout=3000

# Compresión GZIP (acelera la carga de JSON y recursos hasta un 70%)
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024

server.port=${PORT:8080}
server.max-http-header-size=1048576
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
server.tomcat.max-http-form-post-size=-1

# CORS config
spring.web.cors.allowed-origin-patterns=${CORS_ORIGINS:http://localhost:*}
spring.web.cors.allow-credentials=true
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*

# Cloudinary Config
cloudinary.url=${CLOUDINARY_URL:cloudinary://dummy_key:dummy_secret@dummy_name}
